; PlatformIO Project Configuration File for ESP32-S3-CAM (Robot Xiaozhi)
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Tốc độ nạp và Monitor Serial
monitor_speed = 115200
upload_speed = 921600

; Cấu hình bộ nhớ PSRAM và Flash cho module ESP32-S3 (N16R8 / N8R8)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.preremove_flags = 
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB

; Build flags cần thiết cho ESP32-S3 CAM
build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3

; Thư viện phụ thuộc
lib_deps = 
    esp32-camera
